<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--brand:#6C2B3D;--brand-soft:#F3ECEE;--bg:#FAF8F4;--card:#fff;--ink:#2B2A28;--sub:#77736D;--line:#E8E3DC}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo",sans-serif;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:flex-end;align-items:center;padding:16px 0 4px}
.mini{display:flex;align-items:center;gap:7px;color:var(--brand);font-weight:700;font-size:14px;letter-spacing:.08em}
.mini img{width:20px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:12px;font-weight:600;background:#fff}
.lang button{padding:6px 12px;color:var(--sub)} .lang button.on{background:var(--brand);color:#fff}
.hero{text-align:center;padding:22px 0 34px}
.hero img{width:64px}
.hero h1{font-size:20px;font-weight:700;margin-top:16px}
.hero p{font-size:13px;color:var(--sub);margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px}
.hl{background:var(--brand-soft);border-color:#E6D6DB}
.room{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:6px}
.room .nm{grid-column:1/-1;font-size:12px;color:var(--sub);margin-bottom:2px}
.room .nm b{display:block;color:var(--brand);font-size:22px;margin-top:2px}
.ci small{display:block;color:var(--sub);font-size:11.5px}
.ci strong{font-size:17px;font-weight:700}
.ci span{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.arr{color:#C9C2B9;font-size:15px} .arr em{display:block;font-style:normal;font-size:11px;color:var(--brand);font-weight:600}
.row{display:flex;gap:13px;align-items:flex-start}
.ico{flex:0 0 34px;height:34px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.hl .ico{background:#fff}
.ico svg{width:17px;height:17px}
.row h3{font-size:14px;font-weight:700;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.row h3 em{font-style:normal;font-size:10.5px;color:var(--sub);font-weight:500}
.row p{color:#55514B;font-size:13px;line-height:1.6;margin-top:3px}
.big{font-size:17px;font-weight:700;color:var(--brand);margin-top:4px;line-height:1.5}
.big small{font-size:12px;font-weight:600;color:var(--sub);margin-right:6px}
.big .am{font-size:12.5px}
.bf{margin-top:6px}
.bf-day{padding:8px 0;border-top:1px solid rgba(108,43,61,.12)} .bf-day:first-child{border-top:0;padding-top:2px}
.bf-day .d{font-size:12px;color:var(--sub);font-weight:600}
.bf-day .tm{font-size:17px;font-weight:700;color:var(--brand)}
.bf-day ul{list-style:none;margin-top:2px} .bf-day li{font-size:13px;color:#55514B;line-height:1.6}
.grid2{display:block}
.tap{position:relative;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.tap.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.pin{position:absolute;right:10px;top:10px;color:var(--brand);opacity:.5} .pin svg{width:13px;height:13px} .tap.on .pin{opacity:1}
.map{margin-top:10px;padding:12px 12px 6px}
.label{font-size:12px;font-weight:700;color:var(--sub);margin:0 0 4px 4px}
#map{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}#map::-webkit-scrollbar{display:none}
#map svg{width:100%;min-width:600px;height:auto;display:block}
.swipe{font-size:11px;color:var(--sub);text-align:right;margin:2px 4px 0}
@media (min-width:620px){.swipe{display:none}}
.sp{cursor:pointer} .sp rect{fill:#F8F3F4;stroke:#D9C3CA;transition:fill .3s,stroke .3s}
.sp text{transition:fill .3s} .sp .k{fill:#6C2B3D} .sp .e{fill:#A68A92} .sp .l{fill:#6E5A60}
.sp.on rect{fill:#6C2B3D;stroke:#6C2B3D} .sp.on .k,.sp.on .l{fill:#fff} .sp.on .e{fill:#EBCFD6}
.call{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:12px;background:var(--brand);color:#fff;font-weight:600;font-size:15px;text-decoration:none;margin-top:14px}
.note{font-size:12px;color:var(--sub);text-align:center;margin-top:14px;line-height:1.6}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;margin:0 -16px 14px;padding:10px 16px 0;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:10px 14px 9px;font-size:13.5px;font-weight:600;color:var(--sub);background:#F1EDE7;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;margin-bottom:-1px;white-space:nowrap}
.tab.on{background:var(--card);color:var(--brand);border-color:var(--line);box-shadow:inset 0 3px 0 var(--brand)}
.gcard{padding:20px 18px}
.gt{font-size:17px;font-weight:700;line-height:1.4}
.tools{display:flex;gap:22px;margin:16px 0 4px}
.tool{display:flex;flex-direction:column;align-items:center;gap:6px;color:#4A4642;font-size:12px;font-weight:600;text-align:center;line-height:1.35}
.tool svg{width:48px;height:40px}
.steps{list-style:none;margin-top:14px}
.steps li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.65;color:#3E3A36}
.steps li:first-child{border-top:0}
.steps .no{flex:0 0 22px;height:22px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.steps small{display:block;font-size:12.5px;color:var(--sub);margin-top:4px}
.rules{list-style:none;margin-top:10px}
.rules li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.rules li:first-child{border-top:0}
.rules .ri{flex:0 0 32px;height:32px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.rules .ri svg{width:17px;height:17px}
.rules p{font-size:13.5px;line-height:1.65;color:#3E3A36}
.expired{text-align:center;font-size:12.5px;color:var(--sub);margin:-6px 0 14px;line-height:1.6}
.share{display:block;width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;color:var(--brand);margin-top:14px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(43,42,40,.9);color:#fff;font-size:13px;padding:10px 16px;border-radius:999px;z-index:20}
.empty{text-align:center;padding:80px 10px}
.empty img{width:80px} .empty h2{font-size:18px;margin-top:24px} .empty p{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.6}

</style>
</head>

var RAW="";
function load(){
  var h=location.hash.slice(1), o=h?decode(h):null;
  if(o){RAW=h;if(todayKST()<=o.o)store(h);return o}
  var s=stored();if(!s)return null;
  o=decode(s);
  if(!o||todayKST()>o.o){store("");return null}

}
function decode(s){
  try{
    if(!s) return null;
    s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4)s+="=";
    var bin=atob(s),bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    var o=JSON.parse(new TextDecoder().decode(bytes));
    if(!o||!o.r||!o.i)return null;
    o.o=addDays(o.i,o.n||1);
    o.y=(o.y||[]).map(function(y){var s=hm(y[1]);return [addDays(o.i,y[0]),s+" – "+hm(y[1],80),y[2]]});
    o.b=(o.b||[]).map(function(b){return [addDays(o.i,b[0]),b[1]?hm(b[1]).replace(/^0/,""):"",(b[2]||"").split("")]});
    return o;
  }catch(e){return null}
}
function addDays(d,n){var a=d.split("-").map(Number),x=new Date(Date.UTC(a[0],a[1]-1,a[2]+n));return x.getUTCFullYear()+"-"+("0"+(x.getUTCMonth()+1)).slice(-2)+"-"+("0"+x.getUTCDate()).slice(-2)}
function fmt(d){var a=d.split("-").map(Number),x=new Date(Date.UTC(a[0],a[1]-1,a[2])),w=t("wd")[x.getUTCDay()];
  return lang==="ko"?(a[1]+"."+a[2]+" ("+w+")"):(w+", "+x.toLocaleString("en",{month:"short",timeZone:"UTC"})+" "+a[2])}

function hm(s,plus){s=String(s);var m=Number(s.slice(0,-2))*60+Number(s.slice(-2))+(plus||0);return ("0"+Math.floor(m/60)).slice(-2)+":"+("0"+m%60).slice(-2)}

      '<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" font-size="8.5" font-weight="600" letter-spacing="1.2" fill="'+(on?"#EBCFD6":sub)+'">'+(on?t("you").toUpperCase():en[name])+'</text>'}
  function space(key,x,y,w,hh,ko,enN,lines){var cx=x+w/2,tp=y+hh/2-(lines.length*8)+4;
    var s='<g class="sp" data-sp="'+key+'" onclick="focusSpace(\''+key+'\')"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+hh+'" stroke-width="1"/>'+
      '<text class="k" x="'+cx+'" y="'+tp+'" text-anchor="middle" font-size="15" font-weight="700">'+ko+'</text>'+
      '<text class="e" x="'+cx+'" y="'+(tp+13)+'" text-anchor="middle" font-size="8.5" font-weight="600" letter-spacing="1.2">'+enN+'</text>';
    lines.forEach(function(l,i){s+='<text class="l" x="'+cx+'" y="'+(tp+31+i*15)+'" text-anchor="middle" font-size="11">'+l+'</text>'});
    return s+'</g>'}
  function gate(x1,x2,y,label,below){var cx=(x1+x2)/2;
    return '<line x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'" stroke="'+br+'" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 5"/>'+
      '<text x="'+cx+'" y="'+(below?y+20:y-9)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="#55514B">'+label+'</text>'}
  var s='<svg viewBox="0 0 700 408" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard,-apple-system,sans-serif">';
  s+='<path d="M490 34 H676 V366 H292 M240 366 H24 V34 H440" fill="none" stroke="#DCD5CB" stroke-width="1.2"/>';
  s+='<text x="300" y="186" text-anchor="middle" font-size="10" letter-spacing="3" fill="#B9B2A8">'+(lang==="ko"?"마당":"COURTYARD")+'</text>';
  s+=room("지4",44,54,88,64)+room("지5",44,118,88,64)+room("지6",44,182,88,64);
  s+=room("지3",152,54,96,58)+room("지2",248,54,96,58)+room("명1",344,54,124,58);
  s+=space("ryeon",560,54,96,130,"련","RYEON",["17:00–22:20","07:30–10:40"]);
  s+=space("an",396,212,200,64,"안사랑채","ANSARANG",[t("anHrs")]);
  s+=space("sarang",112,276,250,74,"사랑채","SARANG",[t("saHrs")]);
  s+=gate(440,490,34,t("backGate"),false)+gate(240,292,366,t("mainGate"),true);
  return s+'</svg>';
}
function share(){
  var url=location.origin+location.pathname+"#"+RAW;
  if(navigator.share){navigator.share({title:lang==="ko"?"명지각 투숙 안내":"Myeongjigak · Your stay",url:url}).catch(function(){});return}
  try{navigator.clipboard.writeText(url).then(toast,function(){prompt("",url)})}catch(e){prompt("",url)}
}
function toast(){var d=document.createElement("div");d.className="toast";d.textContent=t("copied");document.body.appendChild(d);setTimeout(function(){d.remove()},2600)}
function scrollMapTo(fr){var m=$("#map");if(m)m.scrollLeft=Math.max(0,(m.scrollWidth-m.clientWidth)*fr)}
var SPX={ryeon:1,an:0.75,sarang:0.2};
function focusSpace(k){FOCUS=FOCUS===k?null:k;applyFocus();if(FOCUS){var m=$("#map");if(m)m.scrollTo({left:(m.scrollWidth-m.clientWidth)*SPX[FOCUS],behavior:"smooth"})}
  if(FOCUS){var m=$("#map");if(m){var r=m.getBoundingClientRect();if(r.top>window.innerHeight-120||r.bottom<0)m.scrollIntoView({behavior:"smooth",block:"center"})}}}
function applyFocus(){$$("[data-sp]").forEach(function(el){el.classList.toggle("on",el.getAttribute("data-sp")===FOCUS)})}

document.addEventListener("click",function(e){var b=e.target.closest(".lang button");if(b){lang=b.dataset.l;render()}});
window.addEventListener("hashchange",function(){D=load();TAB=null;render()});
// 객실에 붙이는 QR용: 주소 끝에 ?tab=tea / spk / rules 를 붙이면 그 탭으로 열림
(function(){var m=location.search.match(/[?&]tab=(\w+)/);if(m)TAB=m[1]})();
D=load();
lang=(D&&D.l)||((navigator.language||"ko").toLowerCase().indexOf("ko")===0?"ko":"en");
render();
</script>
