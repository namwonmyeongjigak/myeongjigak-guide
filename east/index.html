<title>명지각 동관 · 나의 투숙 안내</title>
<style>
:root{--brand:#6C2B3D;--soft:#F3ECEE;--bg:#FAF8F4;--ink:#2B2A28;--sub:#77736D;--line:#E8E3DC}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased}
button{font:inherit;background:none;border:0;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 36px}
.hd{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 0 18px}
.hd img{height:76px;width:auto;display:block}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:12px;font-weight:600;background:#fff}
.lang button{padding:6px 12px;color:var(--sub)}.lang button.on{background:var(--brand);color:#fff}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;margin:0 -16px 14px;padding:10px 16px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.tab{flex:1;padding:10px 0 9px;font-size:13.5px;font-weight:600;color:var(--sub);background:#F1EDE7;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;margin-bottom:-1px}
.tab.on{background:#fff;color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px}
.hl{background:var(--soft);border-color:#E6D6DB}.hl .ico{background:#fff}
.label{font-size:12px;font-weight:700;color:var(--sub);margin:0 0 8px}
.room{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:6px}
.room .nm{grid-column:1/-1;font-size:12px;color:var(--sub);margin-bottom:2px}.room .nm b{display:block;color:var(--brand);font-size:22px;margin-top:2px}
.ci small{display:block;color:var(--sub);font-size:11.5px}.ci strong{font-size:17px;font-weight:700}.ci span{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.arr{color:#C9C2B9;font-size:15px}.arr em{display:block;font-style:normal;font-size:11px;color:var(--brand);font-weight:600}
.pax{grid-column:1/-1;font-size:12.5px;color:var(--sub);margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.row{display:flex;gap:13px;align-items:flex-start}
.ico{flex:0 0 34px;height:34px;border-radius:10px;background:var(--soft);color:var(--brand);display:grid;place-items:center}.ico svg{width:17px;height:17px}
.row h3{font-size:14px;font-weight:700}.row p{color:#55514B;font-size:13px;line-height:1.6;margin-top:3px}.row p b{color:var(--brand);font-weight:600}
.map svg,.town svg{width:100%;height:auto;display:block}
.dir{list-style:none;margin-top:6px}.dir li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.dir li:first-child{border-top:0}
.dir span{flex:0 0 22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:700}.dir p{font-size:13px;line-height:1.55;padding-top:2px;color:#55514B}.dir b{color:var(--brand);font-weight:600}
.bf-day{border-top:1px solid rgba(108,43,61,.12);padding:10px 0}.bf-day:first-of-type{border-top:0;padding-top:2px}
.bf-day .d{font-size:12px;font-weight:600;color:var(--sub)}.bf-day .tm{font-size:17px;font-weight:700;color:var(--brand)}
.bf-day ul{list-style:none;margin-top:2px}.bf-day li{font-size:13px;color:#55514B;line-height:1.6}.bf-day .pay{margin-top:4px;font-size:12.5px;color:var(--brand);font-weight:600}
.later{font-size:13px;line-height:1.6;color:#55514B;margin-top:2px}.later b{color:var(--brand);font-weight:600}
.note{font-size:12.5px;color:#55514B;line-height:1.65}.note b{color:var(--brand);font-weight:600}
.rules{list-style:none}.rules li{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.rules li:first-child{border-top:0;padding-top:2px}
.rules i{font-style:normal;color:var(--brand);font-weight:700;font-size:13px}.rules b{display:block;font-size:13.5px;font-weight:700;margin-bottom:2px}.rules span{font-size:12.5px;color:#55514B;line-height:1.6}
.addr{display:block;margin-top:6px;padding:8px 11px;border-radius:9px;background:#F7F4EF;font-size:12.5px;line-height:1.5;color:var(--ink)}.addr small{display:block;color:var(--sub);font-size:11px}
.call{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:12px;background:var(--brand);color:#fff;font-weight:600;font-size:15px;text-decoration:none;margin-top:14px}.call svg{width:17px;height:17px}
.hrs{text-align:center;font-size:12px;color:var(--sub);margin-top:10px;line-height:1.6}
.menus{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.menu{border:1px solid var(--line);border-radius:12px;overflow:hidden}.menu img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}.menu div{padding:8px 10px 10px}.menu h4{font-size:12.5px;font-weight:700;line-height:1.35}
.signed{font-size:12px;color:var(--sub);margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.times{font-size:13.5px;font-weight:700;margin-bottom:6px}
